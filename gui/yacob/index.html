<div class="modal-backdrop" id="modalBackdrop">
    <div class="modal">
        <div class="modal-header">
            ⚙️ <span class="tool-name" id="modalToolName"></span>
            <button class="close-btn" id="modalClose">✕</button>
        </div>
        <div class="modal-body">
            <div class="modal-section">
                <h4>Parameters</h4>
                <pre id="modalParams"></pre>
            </div>
            <div class="modal-section">
                <h4>Result</h4>
                <pre id="modalResult"></pre>
            </div>
        </div>
    </div>
</div>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YaCob</title>
<style>
    :root {
        --bg: #f6f7f2;
        --panel: #ffffff;
        --panel-2: #ffffff;
        --border: #e2e6d8;
        --text: #2b3324;
        --muted: #7c8671;
        --accent: #3f9e52;
        --accent-2: #35914a;
        --ok: #3f9e52;
        --warn: #e8821e;
        --danger: #d84a3f;
        --radius: 14px;
        font-size: 15px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        background: var(--bg);
        color: var(--text);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        height: 100vh;
        display: flex;
        flex-direction: column;
    }
    header {
        padding: 14px 20px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        gap: 10px;
        background: var(--panel);
    }
    header .logo {
        width: 30px; height: 30px;
        border-radius: 9px;
        background: linear-gradient(135deg, var(--accent), var(--warn));
        display: flex; align-items: center; justify-content: center;
        font-weight: 700; font-size: 15px; color: #fff;
    }
    header h1 { font-size: 16px; font-weight: 600; }
    header .sub { font-size: 12px; color: var(--muted); margin-left: auto; }

    #chat {
        flex: 1;
        overflow-y: auto;
        padding: 24px 0 12px;
    }
    .inner { max-width: 780px; margin: 0 auto; padding: 0 20px; display: flex; flex-direction: column; gap: 14px; }

    .msg { display: flex; flex-direction: column; max-width: 85%; animation: pop .18s ease-out; }
    @keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .msg.user { align-self: flex-end; align-items: flex-end; }
    .msg.assistant { align-self: flex-start; align-items: flex-start; }
    .bubble {
        padding: 11px 15px;
        border-radius: var(--radius);
        line-height: 1.55;
        white-space: pre-wrap;
        word-break: break-word;
    }
    .user .bubble { background: var(--accent-2); color: #fff; border-bottom-right-radius: 4px; }
    .assistant .bubble { background: var(--panel-2); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
    .meta { font-size: 11px; color: var(--muted); margin-top: 4px; padding: 0 4px; }

    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
    .chip {
        font-size: 11px;
        background: var(--panel);
        border: 1px solid var(--border);
        color: var(--muted);
        border-radius: 999px;
        padding: 3px 10px;
        cursor: pointer;
        transition: background .12s, border-color .12s;
    }
    .chip:hover { background: #e8eddf; border-color: var(--accent); color: var(--text); }
    .chip b { color: var(--text); font-weight: 600; }

    .file-tag {
        display: inline-flex; align-items: center; gap: 6px;
        font-size: 12px; color: #fff9;
        margin-bottom: 6px;
    }

    /* approval card */
    .approval {
        align-self: stretch;
        background: #fff6e9;
        border: 1px solid var(--warn);
        border-radius: var(--radius);
        padding: 14px 16px;
        animation: pop .18s ease-out;
    }
    .approval h3 {
        font-size: 13px; font-weight: 600; color: #c2690f;
        display: flex; align-items: center; gap: 8px; margin-bottom: 10px;
    }
    .approval .tool {
        background: #fff;
        border: 1px solid #f0dcc0;
        border-radius: 10px;
        padding: 10px 12px;
        margin-bottom: 8px;
    }
    .approval .tool .name { font-family: ui-monospace, monospace; font-size: 13px; color: var(--accent); }
    .approval .tool pre {
        font-family: ui-monospace, monospace;
        font-size: 12px; color: var(--muted);
        white-space: pre-wrap; word-break: break-all;
        margin-top: 6px;
    }
    .approval .actions { display: flex; gap: 8px; margin-top: 4px; }
    .approval .decided { font-size: 12px; margin-top: 6px; font-weight: 600; }
    .btn {
        border: none; border-radius: 9px;
        padding: 8px 16px;
        font-size: 13px; font-weight: 600;
        cursor: pointer;
        transition: filter .12s;
    }
    .btn:hover { filter: brightness(1.08); }
    .btn:disabled { opacity: .45; cursor: default; }
    .btn.ok { background: var(--ok); color: #fff; }
    .btn.no { background: var(--danger); color: #fff; }

    .typing { display: flex; gap: 5px; padding: 14px 6px; align-self: flex-start; }
    .typing span {
        width: 7px; height: 7px; border-radius: 50%;
        background: var(--muted);
        animation: blink 1.2s infinite;
    }
    .typing span:nth-child(2) { animation-delay: .2s; }
    .typing span:nth-child(3) { animation-delay: .4s; }
    @keyframes blink { 0%, 60%, 100% { opacity: .25; } 30% { opacity: 1; } }

    .error {
        align-self: stretch;
        background: #fdedeb;
        border: 1px solid var(--danger);
        color: #a93a30;
        border-radius: var(--radius);
        padding: 10px 14px;
        font-size: 13px;
    }

    footer {
        border-top: 1px solid var(--border);
        background: var(--panel);
        padding: 14px 20px 18px;
    }
    .composer {
        max-width: 780px; margin: 0 auto;
        background: var(--panel-2);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 10px 12px;
        display: flex; flex-direction: column; gap: 8px;
        transition: border-color .15s;
    }
    .composer:focus-within { border-color: var(--accent); }
    .composer .pending-file {
        display: none;
        align-items: center; gap: 8px;
        font-size: 12px; color: var(--text);
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 5px 10px;
        width: fit-content;
    }
    .composer .pending-file button { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 14px; }
    .row { display: flex; align-items: flex-end; gap: 10px; }
    textarea {
        flex: 1;
        background: transparent;
        border: none;
        resize: none;
        color: var(--text);
        font: inherit;
        line-height: 1.5;
        max-height: 140px;
        outline: none;
    }
    textarea::placeholder { color: var(--muted); }

    /* modal */
    .modal-backdrop {
        display: none;
        position: fixed; inset: 0;
        background: rgba(0,0,0,.35);
        z-index: 100;
        align-items: center; justify-content: center;
        padding: 20px;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        width: 100%; max-width: 640px;
        max-height: 80vh;
        display: flex; flex-direction: column;
        box-shadow: 0 8px 40px rgba(0,0,0,.18);
        animation: pop .15s ease-out;
    }
    .modal-header {
        display: flex; align-items: center; gap: 10px;
        padding: 14px 16px;
        border-bottom: 1px solid var(--border);
        font-weight: 600; font-size: 14px;
    }
    .modal-header .tool-name { font-family: ui-monospace,monospace; color: var(--accent); }
    .modal-header .close-btn { margin-left: auto; background: none; border: none; font-size: 18px; color: var(--muted); cursor: pointer; border-radius: 6px; padding: 2px 6px; }
    .modal-header .close-btn:hover { background: var(--bg); color: var(--text); }
    .modal-body { overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
    .modal-section h4 { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 6px; }
    .modal-section pre {
        background: #1e2a1a; color: #c8e6b0;
        border-radius: 10px; padding: 12px 14px;
        font-family: ui-monospace,monospace; font-size: 12px;
        white-space: pre-wrap; word-break: break-all;
        margin: 0;
    }

    /* markdown */
    .bubble h1,.bubble h2,.bubble h3,.bubble h4 { font-weight: 600; margin: .75em 0 .25em; line-height: 1.3; }
    .bubble h1 { font-size: 1.2em; } .bubble h2 { font-size: 1.1em; } .bubble h3,.bubble h4 { font-size: 1em; }
    .bubble p { margin: .45em 0; }
    .bubble p:first-child { margin-top: 0; } .bubble p:last-child { margin-bottom: 0; }
    .bubble ul,.bubble ol { padding-left: 1.4em; margin: .4em 0; }
    .bubble li { margin: .2em 0; }
    .bubble code { font-family: ui-monospace,monospace; font-size: .88em; background: #e8eddf; color: #2b4a1e; padding: 1px 5px; border-radius: 5px; }
    .assistant .bubble code { background: #e8eddf; color: #2b4a1e; }
    .user .bubble code { background: rgba(255,255,255,.25); color: #fff; }
    .bubble pre { background: #1e2a1a; color: #c8e6b0; border-radius: 10px; padding: 12px 14px; overflow-x: auto; margin: .6em 0; }
    .bubble pre code { background: none; color: inherit; padding: 0; font-size: .85em; }
    .bubble blockquote { border-left: 3px solid var(--accent); margin: .5em 0; padding: .2em 0 .2em .75em; color: var(--muted); }
    .bubble a { color: var(--accent); text-decoration: underline; }
    .bubble hr { border: none; border-top: 1px solid var(--border); margin: .6em 0; }
    .bubble table { border-collapse: collapse; width: 100%; margin: .5em 0; font-size: .9em; }
    .bubble th,.bubble td { border: 1px solid var(--border); padding: 5px 10px; text-align: left; }
    .bubble th { background: #e8eddf; font-weight: 600; }
    .bubble strong { font-weight: 700; }
    .bubble em { font-style: italic; }
    .icon-btn {
        background: none; border: none;
        color: var(--muted);
        cursor: pointer;
        font-size: 18px;
        padding: 6px;
        border-radius: 8px;
        transition: color .12s, background .12s;
    }
    .icon-btn:hover { color: var(--text); background: var(--bg); }
    #send {
        background: var(--accent);
        color: #fff;
        border: none;
        border-radius: 10px;
        width: 38px; height: 38px;
        font-size: 16px;
        cursor: pointer;
        transition: filter .12s;
        flex-shrink: 0;
    }
    #send:hover { filter: brightness(1.12); }
    #send:disabled { opacity: .4; cursor: default; }
    .hint { max-width: 780px; margin: 8px auto 0; font-size: 11px; color: var(--muted); text-align: center; }
</style>
</head>
<body>

<header>
    <div class="logo">Y</div>
    <h1>YaCob</h1>
    <div class="sub" id="status">memory only — refresh clears the chat</div>
</header>

<div id="chat"><div class="inner" id="messages"></div></div>

<footer>
    <div class="composer">
        <div class="pending-file" id="pendingFile">
            <span>📎</span><span id="pendingFileName"></span>
            <button id="removeFile" title="Remove">✕</button>
        </div>
        <div class="row">
            <button class="icon-btn" id="attach" title="Attach file">📎</button>
            <textarea id="input" rows="1" placeholder="Ask YaCob…"></textarea>
            <button id="send" title="Send">➤</button>
        </div>
    </div>
    <div class="hint" id="hint"></div>
    <input type="file" id="file" hidden accept="image/*,.pdf,.txt,.md,.csv,.json">
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js"></script>
<script>
(function()
{
    const API = "/api/v1/ask-yacob";

    // ---- in-memory state only (cleared on refresh, no storage APIs) ----
    const history = [
        { role: "system", content: "You are a helpful accounting assistant with access to an ERP and CRM system. " +
        "Use the tools to answer questions and interact with the system. Do not answer general questions that do not relate to the ERP system." }
    ];
    let pendingApprovals = null; // [{approvalId, toolName, input, decision}]
    let attachedFile = null;
    let busy = false;

    const $ = id => document.getElementById(id);
    const messagesEl = $("messages"), chatEl = $("chat"), inputEl = $("input"),
          sendEl = $("send"), fileEl = $("file"), hintEl = $("hint");

    marked.setOptions({ breaks: true, gfm: true });

    const md = text => marked.parse(text ?? "");

    // ---------------- modal ----------------

    const modalBackdrop = $("modalBackdrop");

    function openModal(toolName, input, result)
    {
        $("modalToolName").textContent = toolName;
        $("modalParams").textContent = JSON.stringify(input ?? {}, null, 2);

        let resultText;
        try { resultText = JSON.stringify(JSON.parse(result), null, 2); }
        catch { resultText = result ?? "(no result)"; }
        $("modalResult").textContent = resultText;

        modalBackdrop.classList.add("open");
    }

    function closeModal() { modalBackdrop.classList.remove("open"); }

    $("modalClose").onclick = closeModal;
    modalBackdrop.addEventListener("click", e => { if(e.target === modalBackdrop) closeModal(); });
    document.addEventListener("keydown", e => { if(e.key === "Escape") closeModal(); });

    // ---------------- rendering ----------------

    function scroll() { chatEl.scrollTop = chatEl.scrollHeight; }

    function el(html)
    {
        const t = document.createElement("template");
        t.innerHTML = html.trim();
        return t.content.firstChild;
    }

    const esc = s => String(s).replace(/[&<>"']/g, c =>
        ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

    function addUserMessage(text, fileName)
    {
        messagesEl.appendChild(el(`
            <div class="msg user">
                ${fileName ? `<div class="bubble"><div class="file-tag">📎 ${esc(fileName)}</div>${esc(text)}</div>` : `<div class="bubble">${esc(text)}</div>`}
            </div>`));
        scroll();
    }

    function addAssistantMessage(text, steps)
    {
        const toolCalls = (steps ?? []).flatMap(s => s.toolCalls ?? []);
        const toolResults = (steps ?? []).flatMap(s => s.toolResults ?? []);
        const resultById = Object.fromEntries(toolResults.map(r => [r.toolCallId, r.result]));

        const chips = toolCalls.length
            ? `<div class="chips">${toolCalls.map(c => {
                const data = esc(JSON.stringify({ name: c.toolName, input: c.input, result: resultById[c.toolCallId] }));
                return `<span class="chip" data-tool="${data}">⚙️ <b>${esc(c.toolName)}</b></span>`;
              }).join("")}</div>`
            : "";

        const msgEl = el(`
            <div class="msg assistant">
                ${chips}
                <div class="bubble">${md(text || "(no text response)")}</div>
            </div>`);

        msgEl.querySelectorAll(".chip").forEach(chip =>
        {
            chip.addEventListener("click", () =>
            {
                const { name, input, result } = JSON.parse(chip.dataset.tool);
                openModal(name, input, typeof result === "string" ? result : JSON.stringify(result));
            });
        });

        messagesEl.appendChild(msgEl);
        scroll();
    }

    function addError(text)
    {
        messagesEl.appendChild(el(`<div class="error">⚠️ ${esc(text)}</div>`));
        scroll();
    }

    let typingEl = null;
    function showTyping(on)
    {
        if(on && !typingEl)
        {
            typingEl = el(`<div class="typing"><span></span><span></span><span></span></div>`);
            messagesEl.appendChild(typingEl);
            scroll();
        }
        else if(!on && typingEl)
        {
            typingEl.remove();
            typingEl = null;
        }
    }

    function setBusy(b)
    {
        busy = b;
        sendEl.disabled = b || !!pendingApprovals;
        inputEl.disabled = b || !!pendingApprovals;
        hintEl.textContent = pendingApprovals
            ? "Waiting for your approval decision above — input is locked until all calls are decided."
            : "";
    }

    // ---------------- approval flow ----------------

    function showApprovals(approvals)
    {
        pendingApprovals = approvals.map(a => ({ ...a, decision: null }));

        const card = el(`
            <div class="approval">
                <h3>⚠️ YaCob wants to perform ${approvals.length === 1 ? "a write operation" : approvals.length + " write operations"} — your approval is required</h3>
            </div>`);

        for(const a of pendingApprovals)
        {
            const toolEl = el(`
                <div class="tool">
                    <div class="name">${esc(a.toolName ?? "unknown tool")}</div>
                    <pre>${esc(JSON.stringify(a.input ?? {}, null, 2))}</pre>
                    <div class="actions">
                        <button class="btn ok">Approve</button>
                        <button class="btn no">Deny</button>
                    </div>
                    <div class="decided"></div>
                </div>`);

            const [okBtn, noBtn] = toolEl.querySelectorAll("button");
            const decide = approved =>
            {
                a.decision = approved;
                okBtn.disabled = noBtn.disabled = true;
                const d = toolEl.querySelector(".decided");
                d.textContent = approved ? "✓ Approved" : "✕ Denied";
                d.style.color = approved ? "var(--ok)" : "var(--danger)";
                maybeSubmitApprovals();
            };
            okBtn.onclick = () => decide(true);
            noBtn.onclick = () => decide(false);

            card.appendChild(toolEl);
        }

        messagesEl.appendChild(card);
        setBusy(false); // unlock UI state update (input stays locked via pendingApprovals)
        scroll();
    }

    function maybeSubmitApprovals()
    {
        if(pendingApprovals.some(a => a.decision === null)) return;

        const approvals = pendingApprovals.map(a => ({ approvalId: a.approvalId, approved: a.decision }));
        pendingApprovals = null;
        request({ approvals });
    }

    // ---------------- backend communication ----------------

    async function request({ approvals } = {})
    {
        setBusy(true);
        showTyping(true);

        try
        {
            let response;

            if(attachedFile && !approvals)
            {
                const fd = new FormData();
                fd.append("messages", JSON.stringify(history));
                fd.append("file", attachedFile);
                attachedFile = null;
                $("pendingFile").style.display = "none";
                response = await fetch(API, { method: "POST", body: fd });
            }
            else
            {
                response = await fetch(API, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ messages: history, ...(approvals && { approvals }) })
                });
            }

            const data = await response.json();
            console.log("steps:", JSON.stringify(data.steps, null, 2));
            showTyping(false);

            if(!response.ok)
                return addError(data.message ?? data.error?.message ?? `Request failed (HTTP ${response.status})`);

            if(data.status === "approval_required")
            {
                // append the opaque model messages unchanged — they contain the
                // tool calls being approved and must round-trip to the backend
                history.push(...data.messages);
                return showApprovals(data.pendingApprovals);
            }

            // done
            history.push({ role: "assistant", content: data.text || "" });
            addAssistantMessage(data.text, data.steps);
        }
        catch(x)
        {
            showTyping(false);
            addError(x.message ?? String(x));
        }
        finally
        {
            setBusy(false);
            inputEl.focus();
        }
    }

    function sendMessage()
    {
        const text = inputEl.value.trim();
        if(!text || busy || pendingApprovals) return;

        history.push({ role: "user", content: text });
        addUserMessage(text, attachedFile?.name);

        inputEl.value = "";
        inputEl.style.height = "auto";
        request();
    }

    // ---------------- wiring ----------------

    sendEl.onclick = sendMessage;

    inputEl.addEventListener("keydown", e =>
    {
        if(e.key === "Enter" && !e.shiftKey)
        {
            e.preventDefault();
            sendMessage();
        }
    });

    inputEl.addEventListener("input", () =>
    {
        inputEl.style.height = "auto";
        inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + "px";
    });

    $("attach").onclick = () => fileEl.click();

    fileEl.onchange = () =>
    {
        attachedFile = fileEl.files[0] ?? null;
        fileEl.value = "";
        if(attachedFile)
        {
            $("pendingFileName").textContent = attachedFile.name;
            $("pendingFile").style.display = "flex";
        }
    };

    $("removeFile").onclick = () =>
    {
        attachedFile = null;
        $("pendingFile").style.display = "none";
    };

    inputEl.focus();
})();
</script>
</body>
</html>
