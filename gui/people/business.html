<!DOCTYPE HTML>
<html>
    <head>
        <script type="text/javascript" src="/js/axios/axios.min.js"></script>
        <script type="text/javascript" src="/js/vue/vue.js"></script>
        <script type="text/javascript" src="/_generic/session.js"></script>
        <script type="text/javascript" src="/_generic/filters.js"></script>
        <link rel="stylesheet" type="text/css" href="profile.css" />
    </head>
    <body>
        <main class="sheet-page">
            <div class="modal sheet">
                <div class="sheet-header">
                    <div class="logo-wrap" @click="$refs.logoInput.click()" :title="$filters.translate('people.business.change-logo')">
                        <img :src="logoUrl" alt="" />
                        <span class="picture-overlay">&#x1F4F7;</span>
                        <input type="file" accept="image/*" ref="logoInput" style="display: none" @change="selectLogo($event)" />
                    </div>
                    <div>
                        <h3>{{ $filters.translate(business._id ? "people.business.edit" : "people.business.new") }}</h3>
                        <small v-if="business._id">{{ business.name }}</small>
                    </div>
                </div>

                <div class="fields">
                    <span class="title">{{ $filters.translate("people.business.general") }}</span>
                    <label>
                        {{ $filters.translate("people.business.name") }}
                        <input type="text" v-model="business.name" />
                    </label>
                    <div class="row">
                        <label>
                            {{ $filters.translate("people.business.number") }}
                            <input type="text" v-model="business.business_number" />
                        </label>
                        <label class="narrow">
                            {{ $filters.translate("people.business.currency") }}
                            <input type="text" v-model="business.default_currency" maxlength="3" />
                        </label>
                    </div>
                    <label class="checkbox">
                        <input type="checkbox" v-model="business.fictive" />
                        {{ $filters.translate("people.business.fictive") }}
                    </label>

                    <span class="title">{{ $filters.translate("people.business.fiscal-year") }}</span>
                    <div class="row">
                        <label>
                            {{ $filters.translate("people.business.closing-month") }}
                            <select v-model="business.closing_month">
                                <option :value="null">–</option>
                                <option v-for="month in 12" :value="month">{{ monthName(month) }}</option>
                            </select>
                        </label>
                        <label class="narrow">
                            {{ $filters.translate("people.business.closing-day") }}
                            <input type="number" min="1" max="31" v-model.number="business.closing_day_of_month" />
                        </label>
                    </div>
                    <div class="row">
                        <label>
                            {{ $filters.translate("people.business.locked-until") }}
                            <input type="date" v-model="business.locked_until" />
                        </label>
                        <label>
                            {{ $filters.translate("people.business.canceled-at") }}
                            <input type="date" v-model="business.canceled_at" />
                        </label>
                    </div>

                    <span class="title">{{ $filters.translate("people.business.alternate-ledgers") }}</span>
                    <div class="row" v-for="(ledger, index) in business.alternate_ledgers">
                        <input type="text" v-model="business.alternate_ledgers[index]" />
                        <button class="remove" @click="business.alternate_ledgers.splice(index, 1)">&#x2715;</button>
                    </div>
                    <div><button class="add-mini" @click="business.alternate_ledgers.push('')">+ {{ $filters.translate("people.business.alternate-ledgers.add") }}</button></div>
                </div>

                <span class="error" v-if="error">{{ error }}</span>
                <div class="actions">
                    <button @click="save()" :disabled="saving">{{ $filters.translate("people.save") }}</button>
                    <button @click="close()">{{ $filters.translate("people.cancel") }}</button>
                </div>
            </div>
        </main>
        <script type="text/javascript">
            let app = Vue.createApp(
            {
                data()
                {
                    return {
                        business: { default_currency: "EUR", fictive: false, closing_month: 12, closing_day_of_month: 31, alternate_ledgers: [] },
                        owner: null,
                        logo: null,
                        logoPreview: null,
                        saving: false,
                        error: null
                    };
                },

                computed:
                {
                    logoUrl()
                    {
                        if(this.logoPreview)
                            return this.logoPreview;

                        return this.business._id ? `/api/v1/businesses/${this.business._id}/logo` : "/people/organization.svg";
                    }
                },

                async mounted()
                {
                    // the escape key of the main window does not reach this frame
                    addEventListener("keydown", event => event.key === "Escape" && this.close());

                    // translations are not reactive, so render again once they are available
                    await loadTranslations({ "code*": "people." });
                    this.$forceUpdate();

                    // called either as business.html?id=<business id> to edit or business.html?owner=<identity id> to create
                    let params = new URLSearchParams(self.location.search);
                    this.owner = params.get("owner");

                    if(params.get("id"))
                    {
                        try
                        {
                            let res = await axios.get(`/api/v1/businesses/${params.get("id")}`);
                            this.business = {
                                ...res.data,
                                closing_month: res.data.closing_month ?? null,
                                alternate_ledgers: res.data.alternate_ledgers || [],
                                locked_until: res.data.locked_until?.substring(0, 10),
                                canceled_at: res.data.canceled_at?.substring(0, 10)
                            };
                        }
                        catch(x)
                        {
                            this.error = x?.response?.data?.error || x?.message || String(x);
                        }
                    }
                },

                methods:
                {
                    monthName(month)
                    {
                        return new Date(2000, month - 1, 1).toLocaleString(navigator.language, { month: "long" });
                    },

                    selectLogo(event)
                    {
                        let file = event.target.files[0];
                        event.target.value = "";

                        if(!file)
                            return;

                        if(this.logoPreview)
                            URL.revokeObjectURL(this.logoPreview);

                        this.logo = file;
                        this.logoPreview = URL.createObjectURL(file);
                    },

                    async save()
                    {
                        this.error = null;

                        if(!this.business.name?.trim())
                            return this.error = this.$filters.translate("people.new.error.name-required");

                        if(!/^[A-Za-z]{3}$/.test(this.business.default_currency?.trim() || ""))
                            return this.error = this.$filters.translate("people.business.error.currency");

                        let day = this.business.closing_day_of_month;
                        if(day !== "" && day != null && !(Number.isInteger(day) && day >= 1 && day <= 31))
                            return this.error = this.$filters.translate("people.business.error.closing-day");

                        this.saving = true;

                        try
                        {
                            // null clears a field on update, while undefined leaves the schema default on creation
                            let empty = this.business._id ? null : undefined;
                            let payload = {
                                name: this.business.name.trim(),
                                business_number: this.business.business_number?.trim() || empty,
                                default_currency: this.business.default_currency.trim().toUpperCase(),
                                fictive: !!this.business.fictive,
                                closing_month: this.business.closing_month || empty,
                                closing_day_of_month: (day === "" || day == null) ? empty : day,
                                locked_until: this.business.locked_until || empty,
                                canceled_at: this.business.canceled_at || empty,
                                alternate_ledgers: this.business.alternate_ledgers.map(l => l?.trim()).filter(l => l)
                            };

                            let id = this.business._id;
                            if(id)
                                await axios.patch(`/api/v1/businesses/${id}`, payload);
                            else id = (await axios.post(`/api/v1/identities/${this.owner}/businesses`, payload)).data._id;

                            if(this.logo)
                            {
                                let binary = await this.logo.arrayBuffer();
                                await axios.put(`/api/v1/businesses/${id}/logo`, binary,
                                    { headers: { "Content-Type": this.logo.type || "application/octet-stream" } });
                            }

                            // refresh the identity page behind the modal and the selected business in the header
                            parent.frames.main.location.reload();
                            parent.document.app.updateSessionData();
                            parent.document.app.openModal(false);
                        }
                        catch(x)
                        {
                            this.error = x?.response?.data?.error || x?.message || String(x);
                        }
                        finally
                        {
                            this.saving = false;
                        }
                    },

                    close()
                    {
                        parent.document.app.openModal(false);
                    }
                }
            });

            app.config.globalProperties.$filters = { ...filters };
            app.mount("main");
        </script>
    </body>
</html>
