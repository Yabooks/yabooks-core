# request: subject (user::<id>, app::<id>), scope (business::<id> or system), object (area), action
[request_definition]
r = sub, dom, obj, act

# policy: subject (user, app, role or * for everyone), scope pattern, object pattern, action, allow or deny
[policy_definition]
p = sub, dom, obj, act, eft

# g: subject has role within a scope pattern (business::<id>, business::* or *); g2: object belongs to object group
[role_definition]
g = _, _, _
g2 = _, _

# deny overrides allow
[policy_effect]
e = some(where (p.eft == allow)) && !some(where (p.eft == deny))

[matchers]
m = (g(r.sub, p.sub, r.dom) || p.sub == "*") && keyMatch(r.dom, p.dom) && (keyMatch2(r.obj, p.obj) || g2(r.obj, p.obj)) && (r.act == p.act || p.act == "*")
